name: Artifact Manifests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check jsonschema

      - name: Validate artifact manifests
        shell: bash
        run: |
          python ./utils/scripts/validate-artifact-manifests.py
