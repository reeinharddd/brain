version: '3.8'

services:
  # ── MCP Gateway (Unified Orchestrator) ─────────────────────
  mcp-gateway:
    build:
      context: ../mcp/gateway
      dockerfile: Dockerfile
    container_name: brain-mcp-gateway
    restart: unless-stopped
    ports:
      - "${BRAIN_MCP_GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MCP_REGISTRY=/app/mcp-registry.json
      - MCP_DATA_DIR=/data
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - BRAIN_DIR=/brain
    volumes:
      - ../mcp/gateway/mcp-registry.json:/app/mcp-registry.json:ro
      - mcp_data:/data
      - ${BRAIN_DIR:-~/.brain}:/brain:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Vector Database: Qdrant ─────────────────────────────────
  qdrant:
    build:
      context: ./qdrant
      dockerfile: Dockerfile
    image: brain-qdrant:local
    container_name: brain-qdrant
    restart: unless-stopped
    ports:
      - "${BRAIN_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Web Interface: Open WebUI ──────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.3.32
    container_name: brain-open-webui
    restart: unless-stopped
    ports:
      - "${BRAIN_OPEN_WEBUI_PORT:-8080}:8080"
    environment:
      - OLLAMA_BASE_URL=${BRAIN_OLLAMA_URL:-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-brain-secret-key}
      - ENABLE_SIGNUP=false
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - brain-network
    depends_on:
      - qdrant

  # ── Docker Model Runner (Optional LLM Backend) ────────────
  model-runner:
    image: docker/model-runner:latest
    container_name: brain-model-runner
    restart: unless-stopped
    ports:
      - "${BRAIN_MODEL_RUNNER_PORT:-12434}:12434"
    volumes:
      - model_runner_data:/models
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - brain-network
    profiles:
      - model-runner

networks:
  brain-network:
    name: brain-network
    driver: bridge

volumes:
  mcp_data:
    name: brain-mcp-data
  qdrant_data:
    name: brain-qdrant-data
  open_webui_data:
    name: brain-webui-data
  model_runner_data:
    name: brain-model-runner-data
