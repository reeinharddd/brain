# Supabase Auth (GoTrue) – minimal development stack
# Usage: docker compose -f docker-compose.supabase.yml up -d
#
# Ports:
#   9999 - GoTrue Auth service (maps directly, no Kong required)
#   5433 - Postgres (offset from default to avoid conflicts)
#
# The GoTrue API is exposed directly on port 9999.
# The /auth/v1 prefix is implicit – the daemon's client targets GoTrue's
# native endpoints (/signup, /token, /user, /logout, /authorize).

services:
  # ── Postgres: Auth data store ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: brain-supabase-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${SUPABASE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_PG_PASSWORD:-postgres_password_dev}
      POSTGRES_DB: ${SUPABASE_PG_DATABASE:-supabase_auth}
    ports:
      - "5433:5432"
    volumes:
      - brain_supabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPABASE_PG_USER:-postgres} -d ${SUPABASE_PG_DATABASE:-supabase_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - brain_supabase

  # ── GoTrue: Auth service ───────────────────────────────────────────────────
  gotrue:
    image: supabase/gotrue:latest
    container_name: brain-supabase-gotrue
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9999:9999"
    environment:
      # ── API ──────────────────────────────────────────────────────────────
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"

      # ── Database ─────────────────────────────────────────────────────────
      GOTRUE_DB_DRIVER: "postgres"
      GOTRUE_DB_DATABASE_URL: "postgres://${SUPABASE_PG_USER:-postgres}:${SUPABASE_PG_PASSWORD:-postgres_password_dev}@postgres:5432/${SUPABASE_PG_DATABASE:-supabase_auth}?sslmode=disable"

      # ── JWT ──────────────────────────────────────────────────────────────
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-super-secret-jwt-key-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"

      # ── Email / password auth ────────────────────────────────────────────
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${SUPABASE_EMAIL_ENABLED:-true}

      # ── Site URL & redirect rules ────────────────────────────────────────
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-http://127.0.0.1:9090}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_URI_ALLOW_LIST:-"*"}
      GOTRUE_DISABLE_SIGNUP: ${SUPABASE_DISABLE_SIGNUP:-false}

      # ── OAuth: Google ────────────────────────────────────────────────────
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${SUPABASE_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${SUPABASE_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${SUPABASE_GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_GOOGLE_REDIRECT_URI:-http://127.0.0.1:9999/callback}

      # ── OAuth: GitHub ────────────────────────────────────────────────────
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${SUPABASE_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${SUPABASE_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${SUPABASE_GITHUB_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${SUPABASE_GITHUB_REDIRECT_URI:-http://127.0.0.1:9999/callback}

      # ── OAuth: Microsoft / Azure ─────────────────────────────────────────
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${SUPABASE_AZURE_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${SUPABASE_AZURE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${SUPABASE_AZURE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${SUPABASE_AZURE_REDIRECT_URI:-http://127.0.0.1:9999/callback}

      # ── SMTP (optional – only needed when autoconfirm is false) ──────────
      GOTRUE_SMTP_ADMIN_EMAIL: ${SUPABASE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SUPABASE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SUPABASE_SMTP_PORT:-}
      GOTRUE_SMTP_USER: ${SUPABASE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SUPABASE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SUPABASE_SMTP_SENDER_NAME:-}

      # ── Logging ──────────────────────────────────────────────────────────
      GOTRUE_LOG_LEVEL: ${SUPABASE_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - brain_supabase

  # ── Adminer (optional DB management UI) ────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: brain-supabase-adminer
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "postgres"
      ADMINER_DESIGN: "pepa-linha-dark"
    profiles:
      - tools
    networks:
      - brain_supabase

volumes:
  brain_supabase_postgres_data:

networks:
  brain_supabase:
    name: brain_supabase
    driver: bridge
