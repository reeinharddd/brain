apiVersion: brain/v1
kind: mcp
id: minimal
displayName: Minimal
description: MCP support artifact for Minimal.
scope: workspace
owner: user:brain
visibility: private
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/mcps/profiles/minimal.json
sync:
  mode: local
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: mcps/profiles/minimal.json
  files:
    - artifacts/mcps/profiles/full.json
    - artifacts/mcps/profiles/minimal.json
    - artifacts/mcps/profiles/standard.json
mcp:
  transport: remote
  profiles:
    - minimal
    - standard
    - full
  requiredEnv: []
