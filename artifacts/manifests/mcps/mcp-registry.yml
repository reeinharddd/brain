apiVersion: brain/v1
kind: mcp
id: mcp-registry
displayName: Mcp Registry
description: MCP support artifact for Mcp Registry.
scope: workspace
owner: user:brain
visibility: private
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/mcps/gateway/mcp-registry.json
sync:
  mode: local
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: mcps/gateway/mcp-registry.json
  files:
    - artifacts/mcps/gateway/mcp-registry.json
mcp:
  transport: remote
  profiles:
    - minimal
    - standard
    - full
  requiredEnv: []
