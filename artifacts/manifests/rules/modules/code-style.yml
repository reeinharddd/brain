apiVersion: brain/v1
kind: rule
id: code-style
displayName: Code Style
description: Brain rule artifact for Code Style.
scope: organization
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/rules/modules/code-style.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/rules/modules/code-style.md
  files:
    - artifacts/rules/modules/code-style.md
rule:
  priority: 50
  enforcement: required
  mergeStrategy: compose
