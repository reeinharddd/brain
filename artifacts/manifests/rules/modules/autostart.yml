apiVersion: brain/v1
kind: rule
id: autostart
displayName: Autostart
description: Brain rule artifact for Autostart.
scope: organization
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/rules/modules/autostart.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/rules/modules/autostart.md
  files:
    - artifacts/rules/modules/autostart.md
rule:
  priority: 50
  enforcement: required
  mergeStrategy: compose
