apiVersion: brain/v1
kind: rule
id: handover-protocol
displayName: Handover Protocol
description: Brain rule artifact for Handover Protocol.
scope: organization
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/rules/handover-protocol.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/rules/handover-protocol.md
  files:
    - artifacts/rules/handover-protocol.md
rule:
  priority: 100
  enforcement: blocking
  mergeStrategy: compose
