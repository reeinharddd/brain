apiVersion: brain/v1
kind: adapter
id: guardian
displayName: Guardian
description: Operational artifact set for Guardian.
scope: platform
owner: user:brain
visibility: private
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/internal/guardian
sync:
  mode: local
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/internal/guardian/README.md
  files:
    - artifacts/internal/guardian/README.md
adapter:
  target: guardian
  format: markdown
  projection:
    kind: operational
