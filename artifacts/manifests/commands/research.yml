apiVersion: brain/v1
kind: command
id: research
displayName: Research
description: Brain command artifact for Research.
scope: workspace
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/commands/research.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/commands/research.md
  files:
    - artifacts/commands/research.md
command:
  trigger: /research
  autoInvokePolicy: suggest
  outputContract:
    format: markdown
