apiVersion: brain/v1
kind: command
id: review
displayName: Review
description: Brain command artifact for Review.
scope: workspace
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/commands/review.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/commands/review.md
  files:
    - artifacts/commands/review.md
command:
  trigger: /review
  autoInvokePolicy: manual
  outputContract:
    format: markdown
