apiVersion: brain/v1
kind: command
id: update-brain
displayName: Update Brain
description: Brain command artifact for Update Brain.
scope: workspace
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/commands/update-brain.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/commands/update-brain.md
  files:
    - artifacts/commands/update-brain.md
command:
  trigger: /update-brain
  autoInvokePolicy: manual
  outputContract:
    format: markdown
