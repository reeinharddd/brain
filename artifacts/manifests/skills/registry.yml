apiVersion: brain/v1
kind: skill
id: registry
displayName: Registry
description: Skills catalog artifact for Registry.
scope: organization
owner: user:brain
visibility: private
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/skills/registry.yml
sync:
  mode: local
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/skills/registry.yml
  files:
    - artifacts/skills/registry.yml
skill:
  category: registry
  compatibility:
    minCapabilityTier: standard
    preferredCapabilityTier: powerful
