apiVersion: brain/v1
kind: adapter
id: cline
displayName: Cline
description: Adapter artifact for Cline.
scope: workspace
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/adapters/cline
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/adapters/cline/cline_custom_instructions.md
  files:
    - artifacts/adapters/cline/cline_custom_instructions.md
adapter:
  target: cline
  format: markdown
  projection:
    kind: adapter
