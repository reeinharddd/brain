apiVersion: brain/v1
kind: adapter
id: gemini
displayName: Gemini
description: Adapter artifact for Gemini.
scope: workspace
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/adapters/gemini
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/adapters/gemini/GEMINI.md
  files:
    - artifacts/adapters/gemini/GEMINI.md
adapter:
  target: gemini
  format: markdown
  projection:
    kind: adapter
