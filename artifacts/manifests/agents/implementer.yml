apiVersion: brain/v1
kind: agent
id: implementer
displayName: Implementer
description: Brain agent artifact for Implementer.
scope: project
owner: user:brain
visibility: workspace
lifecycle:
  state: active
source:
  type: local
  uri: local://artifacts/agents/implementer.md
sync:
  mode: hybrid
  cloudEnabled: true
security:
  trust: verified
  permissions:
    fs: read
    net: none
    exec: none
content:
  entrypoint: artifacts/agents/implementer.md
  files:
    - artifacts/agents/implementer.md
agent:
  role: Implementer
  modelPolicy:
    preferredTier: standard
    minimumTier: standard
